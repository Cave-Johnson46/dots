$terminal = kitty
$fileManager = nautilus
$menu = wofi --show drun

###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, togglefloating,
bind = $mainMod, space, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, N, togglesplit, # dwindle
bind = $mainMod SHIFT, P, exec, ~/.config/hypr/monitortogle.sh
bind = $mainMod SHIFT, M, exec, $terminal yazi ~/mnt/plex/Movies
bind = $mainMod SHIFT, O, exec, $terminal yazi ~/.config/hypr
bind = $mainMod shift, Z, exec, zen-browser
bind = $mainMod shift, A, exec, helium-browser
bind = $mainMod shift, R, exec, rustdesk
bind = $mainMod shift, delete, exec, shutdown now
bind = $mainMod, F, fullscreen, #
bind = $mainMod, V, exec, $terminal --class clipse -e clipse

bind = ,PRINT, exec, hyprshot -m window
bind = CTRL, delete, exec, hyprlock
bind = $mainMod, A, exec, anyrun

# Move focus with mainMod + arrow keys
bindp = $mainMod, h, movefocus, l
bindp = $mainMod, l, movefocus, r
bindp = $mainMod, k, movefocus, u
bindp = $mainMod, j, movefocus, d

# Switch workspaces with mainMod + [0-9]
bindp = $mainMod, 1, workspace, 1
bindp = $mainMod, 2, workspace, 2
bindp = $mainMod, 3, workspace, 3
bindp = $mainMod, 4, workspace, 4
bindp = $mainMod, 5, workspace, 5
bindp = $mainMod, 6, workspace, 6
bindp = $mainMod, 7, workspace, 7
bindp = $mainMod, 8, workspace, 8
bindp = $mainMod, 9, workspace, 9
bindp = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bindp = $mainMod SHIFT, 1, movetoworkspace, 1
bindp = $mainMod SHIFT, 2, movetoworkspace, 2
bindp = $mainMod SHIFT, 3, movetoworkspace, 3
bindp = $mainMod SHIFT, 4, movetoworkspace, 4
bindp = $mainMod SHIFT, 5, movetoworkspace, 5
bindp = $mainMod SHIFT, 6, movetoworkspace, 6
bindp = $mainMod SHIFT, 7, movetoworkspace, 7
bindp = $mainMod SHIFT, 8, movetoworkspace, 8
bindp = $mainMod SHIFT, 9, movetoworkspace, 9
bindp = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindmp = $mainMod, mouse:272, movewindow
bindmp = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = CTRL ALT, W, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+
bindel = CTRL ALT, S, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-


# Requires playerctl
bindl = CTRL ALT, D, exec, playerctl next
bindl = CTRL ALT, space, exec, playerctl play-pause
bindl = CTRL ALT, A, exec, playerctl previous

